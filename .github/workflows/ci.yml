name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository, documentation and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Validate repository documentation and project metadata
        run: python scripts/check_repository.py
      - name: Compile Python source
        run: python -m compileall -q desktop scripts tests
      - name: Run repository policy unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate shell scripts
        run: bash -n desktop/run_desktop.sh desktop/build_deb.sh

  linux-desktop:
    name: Linux desktop dependencies and source check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install Qt's offscreen OpenGL runtime dependency
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgl1
      - name: Install declared desktop dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Import desktop runtime dependencies
        run: python -c "from PySide6 import QtCore, QtWidgets; import av, zeroconf; print('Qt, PyAV and Zeroconf imports passed')"
      - name: Run a short offscreen UI smoke check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_desktop.py
      - name: Compile desktop Python source
        run: python -m compileall -q desktop scripts

  android:
    name: Android unit-test task, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Run Android tests, lint and debug assembly
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  windows-desktop:
    name: Windows C++ application build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the existing Windows application project
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio installation discovery (vswhere) is unavailable on this runner.'
          }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) {
            throw 'Visual Studio MSBuild was not found on this runner.'
          }
          & $msbuild 'windows/PhoneDock.App/PhoneDock.App.vcxproj' '/m' '/p:Configuration=Release' '/p:Platform=x64' '/p:AppxPackage=false' '/verbosity:minimal'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
